<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verify your email | JobTrail HK</title><meta name="referrer" content="no-referrer"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#fbfdfb;color:#203a32;font:14px system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select{font:inherit}a{color:inherit;text-decoration:none}header{max-width:1180px;margin:auto;padding:25px 30px;display:flex;justify-content:space-between;align-items:center;gap:15px}.brand{display:flex;gap:9px;align-items:center;font-size:21px;font-weight:800}.mark{width:31px;height:31px;display:grid;place-items:center;background:#147d70;color:white;border-radius:9px}select{padding:9px;border:1px solid #dce9e0;border-radius:7px;color:#426550;background:white;font-size:12px}.card{width:min(450px,calc(100% - 40px));margin:45px auto 65px;padding:33px;background:white;border:1px solid #dce9e0;border-radius:18px;box-shadow:0 15px 40px #254e3304}.eyebrow{font-size:9px;letter-spacing:2px;color:#147d70;margin:0 0 17px}h1{font-size:28px;line-height:1.4;letter-spacing:-.8px;margin:0 0 14px}.intro{font-size:12px;color:#74857a;line-height:1.9;margin-bottom:26px}.field{margin-bottom:19px}label{display:block;font-size:12px;margin-bottom:8px}input{width:100%;border:1px solid #dce9e0;border-radius:8px;padding:13px 14px;color:#203a32;background:#fcfefc;font-size:13px}button,.button{cursor:pointer;display:inline-block;padding:13px 16px;border:1px solid #147d70;border-radius:8px;background:#147d70;color:white;font-size:12px;font-weight:650;text-align:center}.wide{width:100%}button:disabled{opacity:.55;cursor:not-allowed}.status{font-size:12px;line-height:1.9;padding:13px 14px;background:#eaf7f1;color:#326a4c;border-radius:8px;margin:20px 0;white-space:pre-wrap;overflow-wrap:anywhere}.status.error{background:#fff0f2;color:#a23446}.status.success{background:#e7f8ee;color:#1f6c4d}.links{display:flex;gap:15px;justify-content:space-between;flex-wrap:wrap;margin-top:23px;color:#147d70;font-size:11px}.hint{font-size:10px;color:#899c8e;line-height:1.9}footer{max-width:1180px;margin:auto;padding:20px 30px;border-top:1px solid #e6eee8;color:#94a297;font-size:10px}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #8cd2b5;outline-offset:3px}[hidden]{display:none!important}@media(max-width:600px){header{padding:20px}.brand{font-size:19px}.card{margin:25px auto 45px;padding:28px 25px}h1{font-size:26px}footer{padding:20px}}
</style></head><body><header><a class="brand" href="/"><span class="mark" aria-hidden="true">J</span>JobTrail HK</a><select id="language" aria-label="Language"><option value="zh-Hant">繁體中文</option><option value="en">English</option><option value="zh-Hans">简体中文</option></select></header><main class="card"><p class="eyebrow">YOUR NEXT OPPORTUNITY</p><h1 data-i="11">Verify your email</h1><p class="intro" data-i="12">We are confirming your email address. Once verified, please sign in to continue.</p><div id="verification-status" class="status" role="status" aria-live="polite" hidden></div><a class="button wide" href="/login" data-i="13">Go to Login</a><div class="links"><a href="/" data-i="0">Home</a><a href="/login" data-i="1">Back to login</a></div><noscript><p class="hint">JavaScript is required. 請啟用 JavaScript 以完成操作。</p></noscript></main><footer>JobTrail HK · <span data-i="10">Your next step, organised.</span></footer><script>
'use strict';
const copy={"en":["Home","Back to login","Email address","New password","Confirm password","Use 8–20 characters.","Please wait…","Could not reach JobTrail. Please try again.","Too many attempts. Please try again later.","Passwords do not match.","Your next step, organised.","Verify your email","We are confirming your email address. Once verified, please sign in to continue.","Go to Login","Checking your verification link…","Email verified successfully. Please sign in. Redirecting to login…","This verification link is invalid or has expired.","Verification link is missing. Please use the link from your verification email."],"zh-Hant":["返回首頁","返回登入","電郵地址","新密碼","確認密碼","使用 8–20 個字元。","請稍候…","無法連接 JobTrail，請稍後再試。","嘗試次數過多，請稍後再試。","兩次密碼不一致，請再次確認。","求職有條理，下一步更清晰。","驗證你的電郵","我們正在確認你的電郵地址。驗證完成後，請登入以繼續。","前往登入","正在檢查驗證連結…","電郵已驗證，即將前往登入頁…","驗證連結無效或已過期。","缺少驗證連結，請使用驗證電郵中的連結。"],"zh-Hans":["返回首页","返回登录","邮箱地址","新密码","确认密码","使用 8–20 个字符。","请稍候…","无法连接 JobTrail，请稍后再试。","尝试次数过多，请稍后再试。","两次密码不一致，请再次确认。","求职有条理，下一步更清晰。","验证你的邮箱","我们正在确认你的邮箱地址。验证完成后，请登录以继续。","前往登录","正在检查验证链接…","邮箱已验证，即将前往登录页…","验证链接无效或已过期。","缺少验证链接，请使用验证邮件中的链接。"]};
const $=id=>document.getElementById(id);let language='zh-Hant';try{const saved=localStorage.getItem('jobtrail-language');if(Object.hasOwn(copy,saved))language=saved;}catch(error){}let currentStatus=null;function showStatus(key,kind='',detail=''){currentStatus={key,kind,detail};renderStatus();}function renderStatus(){if(!currentStatus)return;const node=$('verification-status');node.hidden=false;node.className='status'+(currentStatus.kind?' '+currentStatus.kind:'');node.textContent=copy[language][currentStatus.key]+(currentStatus.detail?'\n'+currentStatus.detail:'');}function renderLanguage(){document.documentElement.lang=language;$('language').value=language;document.title=copy[language][11]+' | JobTrail HK';document.querySelectorAll('[data-i]').forEach(node=>node.textContent=copy[language][Number(node.dataset.i)]);renderStatus();}$('language').addEventListener('change',event=>{language=event.target.value;try{localStorage.setItem('jobtrail-language',language);}catch(error){}renderLanguage();});function errorDetail(data){return typeof data.detail==='string'?data.detail:Array.isArray(data.detail)?data.detail.map(x=>x.msg).join(' '):'';}renderLanguage();
const token = new URLSearchParams(window.location.search).get('token');if(!token){showStatus(17,'error');}else{showStatus(14);fetch('/auth/verify-email',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({ token: token })}).then(async function(response){const data=await response.json().catch(()=>({}));if(response.ok){showStatus(15,'success');window.setTimeout(function(){window.location.replace('/login');},1500);}else if(response.status===429){showStatus(8,'error');}else{showStatus(16,'error',errorDetail(data));}}).catch(function(){showStatus(7,'error');});}
</script></body></html>
