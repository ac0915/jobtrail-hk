<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forgot password · JobTrail HK</title>
  <style>
    :root { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #233047; background: #eef2f8; --blue: #2855c5; --blue-dark: #1c3e98; --muted: #5c6c83; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px; }
    .card { width: min(520px, 100%); padding: 36px; border: 1px solid #c9d8f0; border-radius: 22px; background: white; box-shadow: 0 16px 45px #1d30521a; }
    .brand { display: inline-block; margin-bottom: 22px; color: #23468d; font-size: 21px; font-weight: 750; text-decoration: none; }
    h1 { margin: 0 0 10px; font-size: 30px; letter-spacing: -.6px; color: #1c2940; }
    p { line-height: 1.7; color: var(--muted); }
    label { display: block; margin-bottom: 7px; color: #34465f; font-size: 14px; font-weight: 650; }
    input { width: 100%; padding: 11px 12px; border: 1px solid #bccbe0; border-radius: 10px; background: white; color: #26364f; }
    button { width: 100%; margin-top: 16px; padding: 12px; border: 0; border-radius: 10px; background: var(--blue); color: white; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .6; cursor: not-allowed; }
    .status { margin-top: 18px; padding: 13px; border-radius: 10px; background: #eef3ff; color: #31538d; overflow-wrap: anywhere; }
    .status.success { background: #e7f8ee; color: #1f6c4d; }
    .status.error { background: #fff0f2; color: #a62739; }
    .links { margin-top: 22px; display: flex; justify-content: space-between; }
    a { color: #315cc9; }
  </style>
</head>
<body>
  <main class="card">
    <a class="brand" href="/">JobTrail HK</a>
    <h1>Forgot password?</h1>
    <p>Enter the email address you used to register. If it has an account, we will send a password-reset link.</p>
    <form id="forgot-form">
      <label for="email">Email address</label>
      <input id="email" type="email" required autocomplete="email" maxlength="254">
      <button id="submit" type="submit">Send reset link</button>
    </form>
    <div id="status" class="status" role="status" aria-live="polite"></div>
    <div class="links">
      <a href="/">← Back to JobTrail</a>
      <a href="/profile/my-jobs">My Jobs</a>
    </div>
  </main>

  <script>
    const form = document.getElementById('forgot-form');
    const status = document.getElementById('status');
    const submit = document.getElementById('submit');

    form.addEventListener('submit', async function (event) {
      event.preventDefault();
      submit.disabled = true;
      status.className = 'status';
      status.textContent = 'Sending reset link…';

      try {
        const response = await fetch('/auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: document.getElementById('email').value })
        });
        const data = await response.json().catch(() => ({}));

        if (response.ok) {
          status.className = 'status success';
          status.textContent = data.message || 'If that email has an account, a reset link has been sent.';
          form.reset();
        } else {
          status.className = 'status error';
          status.textContent = data.detail || 'Could not send the reset link. Please try again.';
        }
      } catch (error) {
        status.className = 'status error';
        status.textContent = 'Could not reach JobTrail. Please try again.';
      } finally {
        submit.disabled = false;
      }
    });
  </script>
</body>
</html>
