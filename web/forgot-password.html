<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forgot password? | JobTrail HK</title><meta name="referrer" content="no-referrer"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#fbfdfb;color:#203a32;font:14px system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select{font:inherit}a{color:inherit;text-decoration:none}header{max-width:1180px;margin:auto;padding:25px 30px;display:flex;justify-content:space-between;align-items:center;gap:15px}.brand{display:flex;gap:9px;align-items:center;font-size:21px;font-weight:800}.mark{width:31px;height:31px;display:grid;place-items:center;background:#147d70;color:white;border-radius:9px}select{padding:9px;border:1px solid #dce9e0;border-radius:7px;color:#426550;background:white;font-size:12px}.card{width:min(450px,calc(100% - 40px));margin:45px auto 65px;padding:33px;background:white;border:1px solid #dce9e0;border-radius:18px;box-shadow:0 15px 40px #254e3304}.eyebrow{font-size:9px;letter-spacing:2px;color:#147d70;margin:0 0 17px}h1{font-size:28px;line-height:1.4;letter-spacing:-.8px;margin:0 0 14px}.intro{font-size:12px;color:#74857a;line-height:1.9;margin-bottom:26px}.field{margin-bottom:19px}label{display:block;font-size:12px;margin-bottom:8px}input{width:100%;border:1px solid #dce9e0;border-radius:8px;padding:13px 14px;color:#203a32;background:#fcfefc;font-size:13px}button,.button{cursor:pointer;display:inline-block;padding:13px 16px;border:1px solid #147d70;border-radius:8px;background:#147d70;color:white;font-size:12px;font-weight:650;text-align:center}.wide{width:100%}button:disabled{opacity:.55;cursor:not-allowed}.status{font-size:12px;line-height:1.9;padding:13px 14px;background:#eaf7f1;color:#326a4c;border-radius:8px;margin:20px 0;white-space:pre-wrap;overflow-wrap:anywhere}.status.error{background:#fff0f2;color:#a23446}.status.success{background:#e7f8ee;color:#1f6c4d}.links{display:flex;gap:15px;justify-content:space-between;flex-wrap:wrap;margin-top:23px;color:#147d70;font-size:11px}.hint{font-size:10px;color:#899c8e;line-height:1.9}footer{max-width:1180px;margin:auto;padding:20px 30px;border-top:1px solid #e6eee8;color:#94a297;font-size:10px}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #8cd2b5;outline-offset:3px}[hidden]{display:none!important}@media(max-width:600px){header{padding:20px}.brand{font-size:19px}.card{margin:25px auto 45px;padding:28px 25px}h1{font-size:26px}footer{padding:20px}}
</style></head><body><header><a class="brand" href="/"><span class="mark" aria-hidden="true">J</span>JobTrail HK</a><select id="language" aria-label="Language"><option value="zh-Hant">繁體中文</option><option value="en">English</option><option value="zh-Hans">简体中文</option></select></header><main class="card"><p class="eyebrow">YOUR NEXT OPPORTUNITY</p><h1 data-i="11">Forgot password?</h1><p class="intro" data-i="12">Enter the email address you used to register. If it has an account, we will send a password-reset link.</p><form id="forgot-form"><div class="field"><label for="email" data-i="2">Email address</label><input id="email" type="email" required autocomplete="email" maxlength="254"></div><button id="submit" class="wide" type="submit" data-i="13">Send reset link</button></form><div id="status" class="status" role="status" aria-live="polite" hidden></div><div class="links"><a href="/" data-i="0">Home</a><a href="/login" data-i="1">Back to login</a></div><noscript><p class="hint">JavaScript is required. 請啟用 JavaScript 以完成操作。</p></noscript></main><footer>JobTrail HK · <span data-i="10">Your next step, organised.</span></footer><script>
'use strict';
const copy={"en":["Home","Back to login","Email address","New password","Confirm password","Use 8–20 characters.","Please wait…","Could not reach JobTrail. Please try again.","Too many attempts. Please try again later.","Passwords do not match.","Your next step, organised.","Forgot password?","Enter the email address you used to register. If it has an account, we will send a password-reset link.","Send reset link","Sending reset link…","If that email has an account, a reset link has been sent.","Could not send the reset link. Please try again."],"zh-Hant":["返回首頁","返回登入","電郵地址","新密碼","確認密碼","使用 8–20 個字元。","請稍候…","無法連接 JobTrail，請稍後再試。","嘗試次數過多，請稍後再試。","兩次密碼不一致，請再次確認。","求職有條理，下一步更清晰。","忘記密碼？","輸入註冊時使用的電郵。如果該電郵有對應帳戶，我們會寄出重設密碼連結。","傳送重設連結","正在傳送重設連結…","如果該電郵有對應帳戶，重設密碼連結已寄出。","無法傳送重設連結，請稍後再試。"],"zh-Hans":["返回首页","返回登录","邮箱地址","新密码","确认密码","使用 8–20 个字符。","请稍候…","无法连接 JobTrail，请稍后再试。","尝试次数过多，请稍后再试。","两次密码不一致，请再次确认。","求职有条理，下一步更清晰。","忘记密码？","输入注册时使用的邮箱。如果该邮箱有对应账户，我们会发送重设密码链接。","发送重设链接","正在发送重设链接…","如果该邮箱有对应账户，重设密码链接已发送。","无法发送重设链接，请稍后再试。"]};
const $=id=>document.getElementById(id);let language='zh-Hant';try{const saved=localStorage.getItem('jobtrail-language');if(Object.hasOwn(copy,saved))language=saved;}catch(error){}let currentStatus=null;function showStatus(key,kind='',detail=''){currentStatus={key,kind,detail};renderStatus();}function renderStatus(){if(!currentStatus)return;const node=$('status');node.hidden=false;node.className='status'+(currentStatus.kind?' '+currentStatus.kind:'');node.textContent=copy[language][currentStatus.key]+(currentStatus.detail?'\n'+currentStatus.detail:'');}function renderLanguage(){document.documentElement.lang=language;$('language').value=language;document.title=copy[language][11]+' | JobTrail HK';document.querySelectorAll('[data-i]').forEach(node=>node.textContent=copy[language][Number(node.dataset.i)]);renderStatus();}$('language').addEventListener('change',event=>{language=event.target.value;try{localStorage.setItem('jobtrail-language',language);}catch(error){}renderLanguage();});function errorDetail(data){return typeof data.detail==='string'?data.detail:Array.isArray(data.detail)?data.detail.map(x=>x.msg).join(' '):'';}renderLanguage();
const form=$('forgot-form'),submit=$('submit');let busy=false;form.addEventListener('submit',async function(event){event.preventDefault();if(busy)return;busy=true;submit.disabled=true;showStatus(14);try{const response=await fetch('/auth/forgot-password',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({ email: document.getElementById('email').value })});const data=await response.json().catch(()=>({}));if(response.ok){showStatus(15,'success');form.reset();}else if(response.status===429){showStatus(8,'error');}else{showStatus(16,'error',errorDetail(data));}}catch(error){showStatus(7,'error');}finally{busy=false;submit.disabled=false;}});
</script></body></html>
