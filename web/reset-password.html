<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Choose a new password | JobTrail HK</title><meta name="referrer" content="no-referrer"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#fbfdfb;color:#203a32;font:14px system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select{font:inherit}a{color:inherit;text-decoration:none}header{max-width:1180px;margin:auto;padding:25px 30px;display:flex;justify-content:space-between;align-items:center;gap:15px}.brand{display:flex;gap:9px;align-items:center;font-size:21px;font-weight:800}.mark{width:31px;height:31px;display:grid;place-items:center;background:#147d70;color:white;border-radius:9px}select{padding:9px;border:1px solid #dce9e0;border-radius:7px;color:#426550;background:white;font-size:12px}.card{width:min(450px,calc(100% - 40px));margin:45px auto 65px;padding:33px;background:white;border:1px solid #dce9e0;border-radius:18px;box-shadow:0 15px 40px #254e3304}.eyebrow{font-size:9px;letter-spacing:2px;color:#147d70;margin:0 0 17px}h1{font-size:28px;line-height:1.4;letter-spacing:-.8px;margin:0 0 14px}.intro{font-size:12px;color:#74857a;line-height:1.9;margin-bottom:26px}.field{margin-bottom:19px}label{display:block;font-size:12px;margin-bottom:8px}input{width:100%;border:1px solid #dce9e0;border-radius:8px;padding:13px 14px;color:#203a32;background:#fcfefc;font-size:13px}button,.button{cursor:pointer;display:inline-block;padding:13px 16px;border:1px solid #147d70;border-radius:8px;background:#147d70;color:white;font-size:12px;font-weight:650;text-align:center}.wide{width:100%}button:disabled{opacity:.55;cursor:not-allowed}.status{font-size:12px;line-height:1.9;padding:13px 14px;background:#eaf7f1;color:#326a4c;border-radius:8px;margin:20px 0;white-space:pre-wrap;overflow-wrap:anywhere}.status.error{background:#fff0f2;color:#a23446}.status.success{background:#e7f8ee;color:#1f6c4d}.links{display:flex;gap:15px;justify-content:space-between;flex-wrap:wrap;margin-top:23px;color:#147d70;font-size:11px}.hint{font-size:10px;color:#899c8e;line-height:1.9}footer{max-width:1180px;margin:auto;padding:20px 30px;border-top:1px solid #e6eee8;color:#94a297;font-size:10px}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #8cd2b5;outline-offset:3px}[hidden]{display:none!important}@media(max-width:600px){header{padding:20px}.brand{font-size:19px}.card{margin:25px auto 45px;padding:28px 25px}h1{font-size:26px}footer{padding:20px}}
</style></head><body><header><a class="brand" href="/"><span class="mark" aria-hidden="true">J</span>JobTrail HK</a><select id="language" aria-label="Language"><option value="zh-Hant">繁體中文</option><option value="en">English</option><option value="zh-Hans">简体中文</option></select></header><main class="card"><p class="eyebrow">YOUR NEXT OPPORTUNITY</p><h1 data-i="11">Choose a new password</h1><p class="intro" data-i="12">Enter a new password for your JobTrail account. This will sign you out on all devices.</p><form id="reset-form"><div class="field"><label for="password" data-i="3">New password</label><input id="password" type="password" required minlength="8" maxlength="20" autocomplete="new-password"></div><p class="hint" data-i="5">Use 8–20 characters.</p><div class="field"><label for="confirm" data-i="4">Confirm password</label><input id="confirm" type="password" required minlength="8" maxlength="20" autocomplete="new-password"></div><button id="submit" class="wide" type="submit" data-i="13">Update password</button></form><div id="status" class="status" role="status" aria-live="polite" hidden></div><div class="links"><a href="/" data-i="0">Home</a><a href="/login" data-i="1">Back to login</a></div><noscript><p class="hint">JavaScript is required. 請啟用 JavaScript 以完成操作。</p></noscript></main><footer>JobTrail HK · <span data-i="10">Your next step, organised.</span></footer><script>
'use strict';
const copy={"en":["Home","Back to login","Email address","New password","Confirm password","Use 8–20 characters.","Please wait…","Could not reach JobTrail. Please try again.","Too many attempts. Please try again later.","Passwords do not match.","Your next step, organised.","Choose a new password","Enter a new password for your JobTrail account. This will sign you out on all devices.","Update password","Updating your password…","Password updated. Please sign in again.","This reset link is invalid or has expired.","Reset link is missing. Please use the link from your password-reset email.","Checking your reset link…"],"zh-Hant":["返回首頁","返回登入","電郵地址","新密碼","確認密碼","使用 8–20 個字元。","請稍候…","無法連接 JobTrail，請稍後再試。","嘗試次數過多，請稍後再試。","兩次密碼不一致，請再次確認。","求職有條理，下一步更清晰。","設定新密碼","為 JobTrail 帳戶設定新密碼。完成後，所有裝置上的登入都會失效，請重新登入。","更新密碼","正在更新密碼…","密碼已更新，請重新登入。","重設連結無效或已過期。","缺少重設連結，請使用重設密碼電郵中的連結。","正在檢查重設連結…"],"zh-Hans":["返回首页","返回登录","邮箱地址","新密码","确认密码","使用 8–20 个字符。","请稍候…","无法连接 JobTrail，请稍后再试。","尝试次数过多，请稍后再试。","两次密码不一致，请再次确认。","求职有条理，下一步更清晰。","设置新密码","为 JobTrail 账户设置新密码。完成后，所有设备上的登录都会失效，请重新登录。","更新密码","正在更新密码…","密码已更新，请重新登录。","重设链接无效或已过期。","缺少重设链接，请使用重设密码邮件中的链接。","正在检查重设链接…"]};
const $=id=>document.getElementById(id);let language='zh-Hant';try{const saved=localStorage.getItem('jobtrail-language');if(Object.hasOwn(copy,saved))language=saved;}catch(error){}let currentStatus=null;function showStatus(key,kind='',detail=''){currentStatus={key,kind,detail};renderStatus();}function renderStatus(){if(!currentStatus)return;const node=$('status');node.hidden=false;node.className='status'+(currentStatus.kind?' '+currentStatus.kind:'');node.textContent=copy[language][currentStatus.key]+(currentStatus.detail?'\n'+currentStatus.detail:'');}function renderLanguage(){document.documentElement.lang=language;$('language').value=language;document.title=copy[language][11]+' | JobTrail HK';document.querySelectorAll('[data-i]').forEach(node=>node.textContent=copy[language][Number(node.dataset.i)]);renderStatus();}$('language').addEventListener('change',event=>{language=event.target.value;try{localStorage.setItem('jobtrail-language',language);}catch(error){}renderLanguage();});function errorDetail(data){return typeof data.detail==='string'?data.detail:Array.isArray(data.detail)?data.detail.map(x=>x.msg).join(' '):'';}renderLanguage();
const form=$('reset-form'),submit=$('submit');const token = new URLSearchParams(window.location.search).get('token');let busy=false,completed=false;if(!token){showStatus(17,'error');form.hidden=true;submit.disabled=true;}else{showStatus(18);}form.addEventListener('submit',async function(event){event.preventDefault();if(busy||completed||!token)return;if($('password').value!==$('confirm').value){showStatus(9,'error');$('confirm').focus();return;}busy=true;submit.disabled=true;showStatus(14);try{const response=await fetch('/auth/reset-password',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({
            token: token,
            password: document.getElementById('password').value
          })});const data=await response.json().catch(()=>({}));if(response.ok){completed=true;form.reset();form.hidden=true;showStatus(15,'success');}else if(response.status===429){showStatus(8,'error');}else{showStatus(16,'error',errorDetail(data));}}catch(error){showStatus(7,'error');}finally{busy=false;submit.disabled=completed;}});
</script></body></html>
